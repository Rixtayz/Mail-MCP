name: Publish to MCP Registry

# Run by hand from the Actions tab, after the version in package.json is on npm.
# Authenticates with GitHub OIDC: no personal token or account login involved.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check server.json against package.json and npm
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const npm = srv.packages.find((p) => p.registryType === "npm");
            const problems = [];
            if (srv.name !== pkg.mcpName) problems.push(`server.json name ${srv.name} != package.json mcpName ${pkg.mcpName}`);
            if (srv.version !== pkg.version) problems.push(`server.json version ${srv.version} != package.json version ${pkg.version}`);
            if (!npm || npm.identifier !== pkg.name || npm.version !== pkg.version) problems.push("server.json npm package does not match package.json");
            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          '
          published=$(npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" mcpName)
          if [ "$published" != "$(node -p 'require("./package.json").mcpName')" ]; then
            echo "This version is not on npm yet, or its mcpName differs. Publish to npm first." >&2
            exit 1
          fi

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt" | grep " ${file}\$" | sha256sum -c -
          tar xzf "$file" mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
