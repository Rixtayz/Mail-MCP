name: Release

# Runs when a tag vX.Y.Z is pushed. Publishes the package to npm with provenance
# and attaches the Claude Desktop bundle (.mcpb) to the GitHub release.
# Not workflow_dispatch: npm trusted publishing can reject manually started runs.
# Then run "Publish to MCP Registry" by hand once the version is on npm.
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no stored npm token
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later. Upgrade if the runner's is older.
      - name: Make sure npm supports trusted publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g 'npm@^11.5.1'
          fi
          npm --version

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build. Provenance is automatic
      # with trusted publishing from a public repository, so no flag or token here.
      - run: npm publish

  bundle:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:mcpb

      - name: Extract the changelog section for this version
        run: |
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l.startsWith(`## [${version}]`));
            if (start === -1) {
              console.error(`CHANGELOG.md has no section for ${version}.`);
              process.exit(1);
            }
            let end = lines.findIndex((l, i) => i > start && l.startsWith("## "));
            if (end === -1) end = lines.length;
            const notes = lines.slice(start + 1, end).join("\n").trim();
            if (!notes) {
              console.error(`The CHANGELOG.md section for ${version} is empty.`);
              process.exit(1);
            }
            fs.writeFileSync("release-notes.md", notes + "\n");
          '

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release create "$GITHUB_REF_NAME" "mail-mcp-${version}.mcpb" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
