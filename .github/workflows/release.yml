name: Release

# Runs when a tag vX.Y.Z is pushed. Publishes the package to npm with provenance
# and attaches the Claude Desktop bundle (.mcpb) to the GitHub release.
# Not workflow_dispatch: npm trusted publishing can reject manually started runs.
# Then run "Publish to MCP Registry" by hand once the version is on npm.
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no stored npm token
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Checked here, before publishing: once the version is on npm, a missing or empty
      # CHANGELOG section would fail the bundle job, and re-running it would fail again.
      - name: Check the changelog section for this version
        run: node scripts/release-notes.mjs "$RUNNER_TEMP/release-notes.md"

      # Trusted publishing needs npm 11.5.1 or later. Upgrade if the runner's is older.
      - name: Make sure npm supports trusted publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install -g 'npm@^11.5.1'
          fi
          npm --version

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build. Provenance is automatic
      # with trusted publishing from a public repository, so no flag or token here.
      - run: npm publish

  bundle:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:mcpb

      # Same commit as the npm job, which already checked this section, so this cannot fail on its own.
      - name: Extract the changelog section for this version
        run: node scripts/release-notes.mjs release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release create "$GITHUB_REF_NAME" "mail-mcp-${version}.mcpb" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
