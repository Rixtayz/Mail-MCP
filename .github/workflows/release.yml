name: Release

# Runs when a tag vX.Y.Z is pushed. Builds and tests the tagged commit once, then
# publishes exactly those files: the npm tarball to npm with provenance, and the Claude
# Desktop bundle (.mcpb) to the GitHub release, both with a GitHub build attestation.
# Not workflow_dispatch: npm trusted publishing can reject manually started runs.
# Then run "Publish to MCP Registry" by hand once the version is on npm.
#
# Each job gets only the permissions it needs. The build job, the only one that installs
# dependencies and runs project code, can read the repository and nothing else.
# Actions are pinned by commit SHA; Dependabot keeps the pins and their comments current.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches, for the check that the tag is on main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache in a release: install from the registry

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only a commit already on main is released: a tag on a branch nobody reviewed fails here.
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main." >&2
            exit 1
          fi

      # Checked here, before anything is published: once the version is on npm, a missing or
      # empty CHANGELOG section would fail the release job, and re-running it would fail again.
      - name: Check the changelog section for this version
        run: node scripts/release-notes.mjs release-notes.md

      # No install scripts: they would run code from the dependency tree in the job that
      # builds what gets published.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The repository's lockfile is package-lock.json. The published package carries a copy
      # as npm-shrinkwrap.json, so that npx on npm 7 to 11 installs the dependency tree tested
      # above (npm 12 ignores it). The package ships compiled JavaScript only, no source maps.
      - name: Pack the npm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp package-lock.json npm-shrinkwrap.json
          npm pack --ignore-scripts
          tgz="rixtay-mail-mcp-${VERSION}.tgz"
          contents=$(tar -tzf "$tgz")
          if ! grep -qx 'package/npm-shrinkwrap.json' <<< "$contents"; then
            echo "$tgz does not contain npm-shrinkwrap.json." >&2
            exit 1
          fi
          if grep '\.map$' <<< "$contents"; then
            echo "$tgz contains the source maps above." >&2
            exit 1
          fi

      - run: npm run build:mcpb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: rixtay-mail-mcp-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: mail-mcp-${{ steps.version.outputs.version }}.mcpb
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation in this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb

      # Verify with: gh attestation verify mail-mcp-X.Y.Z.mcpb -R Rixtayz/Mail-MCP
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            mail-mcp-${{ needs.build.outputs.version }}.mcpb
            rixtay-mail-mcp-${{ needs.build.outputs.version }}.tgz

  npm:
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no stored npm token
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later, which Node 24.5.0 and later bundle.
      # This job holds the publishing identity, so it never installs npm: it fails instead.
      - name: Check npm supports trusted publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map((n) => parseInt(n, 10));
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$version"; then
            echo "npm $version is older than 11.5.1, the first version with trusted publishing. Use a newer Node.js in setup-node." >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      # Publishes the tarball the build job tested, as is. Publishing a tarball runs no
      # package script; --ignore-scripts makes sure. Provenance is automatic with trusted
      # publishing from a public repository, so no flag or token here.
      - name: Publish to npm
        env:
          TARBALL: rixtay-mail-mcp-${{ needs.build.outputs.version }}.tgz
        run: npm publish "./$TARBALL" --ignore-scripts

  release:
    needs: [build, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # With files to attach, gh creates the release as a draft, uploads them, then publishes
      # it (and deletes the draft if an upload fails), so an immutable release is complete
      # by the time it becomes immutable.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: mail-mcp-${{ needs.build.outputs.version }}.mcpb
        run: |
          gh release create "$GITHUB_REF_NAME" "$BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
