version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 5 days after a version is published before proposing it, so a compromised
    # release is more likely to be caught and pulled first. Security updates are not delayed.
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
